name: Render Political Analysis Video (Cloud)

on:
  push:
    tags:
      - 'render-political*'
      - 'render-narasannapeta*'
      - 'render-srikakulam*'
  workflow_dispatch:
    inputs:
      target:
        description: 'వీడియో సెలెక్ట్ చేయండి (Target to Render)'
        required: true
        type: choice
        default: 'Srikakulam'
        options:
          - 'Srikakulam'
          - 'Narasannapeta'
          - 'Narasannapeta-Act1-HOOK'
          - 'Narasannapeta-Act2-HISTORY'
          - 'Narasannapeta-Act3-BAGGU'
          - 'Narasannapeta-Act4-MANDALS'
          - 'Narasannapeta-Act5-LEADERSHIP'
          - 'Narasannapeta-Act6-ROADMAP'
          - 'Srikakulam-Act1-HOOK'
          - 'Srikakulam-Act2-HISTORY'
          - 'Srikakulam-Act3-SHANKAR'
          - 'Srikakulam-Act4-NUMBERS'
          - 'Srikakulam-Act5-REASONS'
          - 'Srikakulam-Act6-VERDICT'

jobs:
  render:
    name: 🎬 Render ${{ github.event.inputs.target || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔤 Install Fonts for Telugu & Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-indic fonts-noto-core ffmpeg

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🎥 Determine Target and Render Video
        run: |
          mkdir -p out
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then
            TAG_NAME="${{ github.ref_name }}"
            if [[ "$TAG_NAME" == *srikakulam* ]]; then
              TARGET="Srikakulam"
            elif [[ "$TAG_NAME" == *narasannapeta* ]]; then
              TARGET="Narasannapeta"
            else
              TARGET="Srikakulam"
            fi
          fi
          echo "🚀 Rendering $TARGET on Cloud..."
          bunx remotion render "$TARGET" "out/${TARGET}.mp4" --concurrency=2
          echo "RENDER_TARGET=$TARGET" >> $GITHUB_ENV

      - name: 📤 Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RENDER_TARGET }}-rendered-video
          path: out/*.mp4
          retention-days: 14

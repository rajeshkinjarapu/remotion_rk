name: Render Telugu Quiz Video (Cloud)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'ఏ వీడియో రెండర్ చేయాలి? (Select Target to Render)'
        required: true
        type: choice
        default: 'All-Batch-Videos'
        options:
          - 'All-Batch-Videos'
          - 'TeluguQuiz-topic1-first-train'
          - 'TeluguQuiz-topic2-origin-railways'
          - 'TeluguQuiz-topic3-first-rail-route'
          - 'TeluguQuiz-topic4-railway-development'
          - 'TeluguQuiz-topic5-nationalisation'
          - 'TeluguQuiz-topic6-railway-board'
          - 'TeluguQuiz-topic7-first-electric-train'
          - 'TeluguQuiz-topic8-first-metro-rail'
          - 'TeluguQuiz-topic9-first-railway-station'
          - 'TeluguQuiz-topic10-important-milestones'
          - 'TeluguQuiz-20MCQ-FullVideo'
          - 'TeluguQuiz-SinglePreview'

jobs:
  render:
    name: 🎬 Render Video on GitHub Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🎥 Render Video(s)
        run: |
          mkdir -p out
          TARGET="All-Batch-Videos"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          fi

          if [ "$TARGET" = "All-Batch-Videos" ]; then
            echo "🚀 Rendering All 10 Batch Videos in Sequence..."
            for comp in "TeluguQuiz-topic1-first-train" "TeluguQuiz-topic2-origin-railways" "TeluguQuiz-topic3-first-rail-route" "TeluguQuiz-topic4-railway-development" "TeluguQuiz-topic5-nationalisation" "TeluguQuiz-topic6-railway-board" "TeluguQuiz-topic7-first-electric-train" "TeluguQuiz-topic8-first-metro-rail" "TeluguQuiz-topic9-first-railway-station" "TeluguQuiz-topic10-important-milestones"; do
              echo "--- Rendering $comp ---"
              bunx remotion render "$comp" "out/${comp}.mp4" --concurrency=2 || true
            done
          else
            echo "🚀 Rendering Target: $TARGET..."
            bunx remotion render "$TARGET" "out/${TARGET}.mp4" --concurrency=2
          fi

      - name: 📤 Upload Rendered Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeluguQuiz-Rendered-Videos
          path: out/*.mp4
          retention-days: 14

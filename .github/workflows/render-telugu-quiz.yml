name: Render Telugu Quiz Video (Cloud)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      composition:
        description: 'రెండు కాంపోజిషన్లలో ఏది రెండర్ చేయాలి? (Select Composition)'
        required: true
        type: choice
        default: 'TeluguQuiz-20MCQ-FullVideo'
        options:
          - 'TeluguQuiz-20MCQ-FullVideo'
          - 'TeluguQuiz-SinglePreview'

jobs:
  render:
    name: 🎬 Render Video on GitHub Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🎥 Render Video
        run: |
          mkdir -p out
          COMPOSITION="TeluguQuiz-20MCQ-FullVideo"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMPOSITION="${{ github.event.inputs.composition }}"
          fi

          echo "🚀 Rendering Composition: $COMPOSITION..."
          bunx remotion render "$COMPOSITION" "out/${COMPOSITION}.mp4" --concurrency=2

      - name: 📤 Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: TeluguQuiz-Rendered-Video
          path: out/*.mp4
          retention-days: 14

name: Render Telugu Quiz Videos (Cloud)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'వీడియో సెలెక్ట్ చేయండి (Select Target to Render)'
        required: true
        type: choice
        default: 'Topics-6-to-10'
        options:
          - 'Topics-6-to-10'
          - 'TeluguQuiz-topic6-railway-board'
          - 'TeluguQuiz-topic7-first-electric-train'
          - 'TeluguQuiz-topic8-first-metro-rail'
          - 'TeluguQuiz-topic9-first-railway-station'
          - 'TeluguQuiz-topic10-important-milestones'

jobs:
  render:
    name: 🎬 Render ${{ matrix.topic }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        topic:
          - TeluguQuiz-topic6-railway-board
          - TeluguQuiz-topic7-first-electric-train
          - TeluguQuiz-topic8-first-metro-rail
          - TeluguQuiz-topic9-first-railway-station
          - TeluguQuiz-topic10-important-milestones

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔤 Install Fonts for Telugu & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-indic fonts-noto-core ffmpeg

      - name: ⚡ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🎥 Render Video
        run: |
          mkdir -p out
          TARGET="${{ github.event.inputs.target }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "Topics-6-to-10" ] && [ "$TARGET" != "${{ matrix.topic }}" ]; then
            echo "Skipping ${{ matrix.topic }} because target is $TARGET"
            exit 0
          fi
          echo "🚀 Rendering ${{ matrix.topic }}..."
          bunx remotion render "${{ matrix.topic }}" "out/${{ matrix.topic }}.mp4" --concurrency=2

      - name: 📤 Upload Rendered Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.topic }}
          path: out/${{ matrix.topic }}.mp4
          retention-days: 14
          if-no-files-found: ignore
